# The gym: bouts the referee calls, and the policies of belts it holds.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bouts.gym.gachinetes.dev
spec:
  group: gym.gachinetes.dev
  scope: Cluster
  names: {plural: bouts, singular: bout, kind: Bout, categories: [gym]}
  versions:
  - name: v1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Object, type: string, jsonPath: .spec.object.name}
    - {name: Kind, type: string, jsonPath: .spec.object.kind}
    - {name: Field, type: string, jsonPath: .spec.path}
    - {name: Fight, type: string, jsonPath: .status.summary}
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Last, type: date, jsonPath: .status.lastSeen}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              object:
                type: object
                properties:
                  group: {type: string}
                  kind: {type: string}
                  namespace: {type: string}
                  name: {type: string}
              path: {type: string}
          status:
            type: object
            properties:
              phase: {type: string, enum: [Fighting, Over]}
              fighters: {type: object, additionalProperties: {type: integer}}
              switches: {type: integer}
              firstSeen: {type: string, format: date-time}
              lastSeen: {type: string, format: date-time}
              summary: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: beltpolicies.gym.gachinetes.dev
spec:
  group: gym.gachinetes.dev
  scope: Cluster
  names: {plural: beltpolicies, singular: beltpolicy, kind: BeltPolicy, shortNames: [belts], categories: [gym]}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Kind, type: string, jsonPath: .spec.match.kind}
    - {name: Group, type: string, jsonPath: .spec.match.group}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [match, belts]
            properties:
              match:
                type: object
                required: [kind]
                properties:
                  group: {type: string}
                  kind: {type: string}
                  namespaces: {type: array, items: {type: string}}
                  names: {type: array, items: {type: string}}
              belts:
                type: array
                items:
                  type: object
                  required: [path, holders]
                  properties:
                    path: {type: string}
                    action: {type: string, enum: [Deny, Warn]}
                    holders:
                      type: object
                      properties:
                        managers: {type: array, items: {type: string}}
                        users: {type: array, items: {type: string}}
                        groups: {type: array, items: {type: string}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pricelists.gym.gachinetes.dev
spec:
  group: gym.gachinetes.dev
  scope: Cluster
  names: {plural: pricelists, singular: pricelist, kind: PriceList, categories: [gym]}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: CPU/h, type: number, jsonPath: .spec.cpu}
    - {name: GiB/h, type: number, jsonPath: .spec.memoryGi}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [cpu, memoryGi]
            properties:
              currency: {type: string}
              cpu: {type: number}
              memoryGi: {type: number}
              gpu: {type: object, additionalProperties: {type: number}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: budgets.gym.gachinetes.dev
spec:
  group: gym.gachinetes.dev
  scope: Namespaced
  names: {plural: budgets, singular: budget, kind: Budget, categories: [gym]}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Monthly, type: number, jsonPath: .spec.monthly}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [monthly]
            properties:
              monthly: {type: number}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proteinshakes.gym.gachinetes.dev
spec:
  group: gym.gachinetes.dev
  scope: Cluster
  names: {plural: proteinshakes, singular: proteinshake, kind: ProteinShake, shortNames: [protein], categories: [gym]}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Reserve, type: integer, jsonPath: .spec.reserve.count}
    - {name: CPU, type: string, jsonPath: .spec.reserve.cpu}
    - {name: GPU, type: integer, jsonPath: .spec.reserve.gpu}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              reserve:
                type: object
                required: [count]
                properties:
                  count: {type: integer, minimum: 0}
                  cpu: {type: string}
                  memory: {type: string}
                  gpu: {type: integer, minimum: 0}
              images: {type: array, items: {type: string}}
              nodeSelector: {type: object, additionalProperties: {type: string}}
